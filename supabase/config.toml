# Configuración de Supabase para `supabase start` (stack local con Docker) y referencia de lo
# que hay que configurar en el proyecto hospedado (docs/deploy.md). Solo la sección de Auth
# importa: la app no usa la Data API (PostgREST).
project_id = "kinesiapp"

[api]
enabled = true
port = 54321
# `public` fuera de la Data API: los datos se leen solo vía la conexión de la app con RLS.
schemas = ["graphql_public"]
extra_search_path = ["extensions"]

[db]
port = 54322
major_version = 16

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirmar"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Espejo de MIN_PASSWORD_LENGTH (src/modules/auth/auth.schema.ts); un test los ata.
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.email.template.confirmation]
subject = "Confirmá tu cuenta de kinesiapp"
content_path = "./supabase/templates/confirmation.html"

[auth.mfa.totp]
# MFA del dueño: semana 1 (docs/backlog.md).
enroll_enabled = true
verify_enabled = true
